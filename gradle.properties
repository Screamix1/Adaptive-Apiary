# Память для Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment (имена параметров в исходниках Minecraft)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Minecraft / NeoForge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.256
# Минимальная версия NeoForge, с которой мод согласится запуститься
neo_version_range=[21.1.1,)
loader_version_range=[1,)

# JEI: версия для сборки и минимальная версия у игрока (ниже 19.19 не поддерживается)
jei_version=19.27.0.340
jei_version_range=[19.19,)

# Мод
mod_id=adaptiveapiary
mod_name=Adaptive Apiary
mod_license=LGPLv3
mod_version=1.0
mod_group_id=com.screamix.adaptiveapiary
mod_authors=Screamix
